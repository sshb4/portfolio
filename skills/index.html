<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Redirecting...</title>
	<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
	<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32" />
	<link rel="icon" href="/assets/favicon-16.png" type="image/png" sizes="16x16" />
	<link rel="apple-touch-icon" href="/assets/favicon-180.png" sizes="180x180" />
	<link rel="canonical" href="/" />
	<script>
		try {
			sessionStorage.setItem('homeScrollTarget', 'skills');
			window.location.replace('/');
		} catch (error) {
			window.location.replace('/?scroll=skills');
		}
	</script>
	<noscript>
		<meta http-equiv="refresh" content="0; url=/?scroll=skills" />
	</noscript>
</head>
<body>
	<p>Redirecting to <a href="/?scroll=skills">/</a>...</p>
</body>
</html>
